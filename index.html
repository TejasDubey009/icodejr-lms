    <!-- Enables scroll reveals only when scripts run; content stays visible without them -->
    <script>
      document.documentElement.classList.add("js");
      // If the page script never takes over, show everything rather than leave it hidden
      setTimeout(function () {
        var el = document.documentElement;
        if (!el.hasAttribute("data-reveal-ready")) el.classList.add("reveal-all");
      }, 4000);
    </script>
